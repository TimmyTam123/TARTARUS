<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0d1210">
    <meta name="description" content="Tartarus — a quiet stopwatch, pomodoro and countdown for long study sessions.">
    <title id="title">Tartarus</title>
    <link rel="stylesheet" href="static/style.css">
</head>
<body>
    <video class="backdrop" id="backdrop" autoplay muted loop playsinline disablepictureinpicture>
        <source src="static/lofi_13.mp4" type="video/mp4">
    </video>
    <div class="scrim"></div>

    <!-- ── Icons ────────────────────────────────────────────────
         Drawn rather than typed: glyphs like ⤢ and ⚙ are missing or
         render as colour emoji on some platforms. -->
    <svg class="sprite" aria-hidden="true">
        <symbol id="i-play" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round">
            <path d="M8.5 5.6 18.8 12 8.5 18.4Z"/>
        </symbol>
        <symbol id="i-pause" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M9.5 5.5v13M14.5 5.5v13"/>
        </symbol>
        <symbol id="i-expand" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 9.5V5a1 1 0 0 1 1-1h4.5M14.5 4H19a1 1 0 0 1 1 1v4.5M20 14.5V19a1 1 0 0 1-1 1h-4.5M9.5 20H5a1 1 0 0 1-1-1v-4.5"/>
        </symbol>
        <symbol id="i-toolbox" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="8.5" width="18" height="11.5" rx="2"/>
            <path d="M9 8.5V6.5A1.5 1.5 0 0 1 10.5 5h3A1.5 1.5 0 0 1 15 6.5v2M3 13.5h18M10.5 13.5v2h3v-2"/>
        </symbol>
        <symbol id="i-math" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <rect x="4.5" y="2.5" width="15" height="19" rx="2.5"/>
            <path d="M8 6.75h8"/>
            <path d="M9.25 12.25h.01M14.75 12.25h.01M9.25 17.25h.01M14.75 17.25h.01" stroke-width="2.4"/>
        </symbol>
        <symbol id="i-notes" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14.25 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7.75Z"/>
            <path d="M14.25 3v4.75H19"/>
            <path d="M8.5 12.5h7M8.5 16h4.5"/>
        </symbol>
        <symbol id="i-other" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
            <path d="M6.25 12h.01M12 12h.01M17.75 12h.01"/>
        </symbol>
        <!-- A cartesian plane: axes crossing inside the frame, with a point
             plotted off in the first quadrant. Bare axes read as a move
             cursor at this size, and lose the shape its neighbours have. -->
        <symbol id="i-axes" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <rect x="4.5" y="2.5" width="15" height="19" rx="2.5"/>
            <path d="M11 5.8v12.6M6.8 13h10.4"/>
            <circle cx="14.7" cy="9.3" r="1.3" fill="currentColor" stroke="none"/>
        </symbol>
        <symbol id="i-restart" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 4.5v5.5h-5.5"/>
            <path d="M18.9 15a8 8 0 1 1-1.88-8.32L21 10"/>
        </symbol>
        <symbol id="i-stop" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round">
            <rect x="6.75" y="6.75" width="10.5" height="10.5" rx="2"/>
        </symbol>
        <symbol id="i-volume" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M11.5 5 6.75 9.25H3.5v5.5h3.25L11.5 19Z" fill="currentColor"/>
            <path d="M15.5 9.4a3.8 3.8 0 0 1 0 5.2M18.4 6.6a7.8 7.8 0 0 1 0 10.8"/>
        </symbol>
        <symbol id="i-mute" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M11.5 5 6.75 9.25H3.5v5.5h3.25L11.5 19Z" fill="currentColor"/>
            <path d="M16 9.75 20.5 14.25M20.5 9.75 16 14.25"/>
        </symbol>
        <symbol id="i-gear" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"/>
            <path d="M12 2.5a1.6 1.6 0 0 1 1.6 1.6v.5a1.6 1.6 0 0 0 2.7 1.13l.36-.35a1.6 1.6 0 1 1 2.26 2.26l-.35.36a1.6 1.6 0 0 0 1.13 2.7h.5a1.6 1.6 0 1 1 0 3.2h-.5a1.6 1.6 0 0 0-1.13 2.7l.35.36a1.6 1.6 0 1 1-2.26 2.26l-.36-.35a1.6 1.6 0 0 0-2.7 1.13v.5a1.6 1.6 0 1 1-3.2 0v-.5a1.6 1.6 0 0 0-2.7-1.13l-.36.35a1.6 1.6 0 1 1-2.26-2.26l.35-.36A1.6 1.6 0 0 0 4.6 13.6h-.5a1.6 1.6 0 1 1 0-3.2h.5a1.6 1.6 0 0 0 1.13-2.7l-.35-.36a1.6 1.6 0 1 1 2.26-2.26l.36.35A1.6 1.6 0 0 0 10.4 4.6v-.5A1.6 1.6 0 0 1 12 2.5Z"/>
        </symbol>
        <symbol id="i-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
            <path d="M6.75 6.75 17.25 17.25M17.25 6.75 6.75 17.25"/>
        </symbol>
        <symbol id="i-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
            <path d="M12 6v12M6 12h12"/>
        </symbol>
        <symbol id="i-minus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
            <path d="M6 12h12"/>
        </symbol>
        <symbol id="i-bin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4.5 6.75h15M9.75 6.75V5.2A1.2 1.2 0 0 1 11 4h2a1.2 1.2 0 0 1 1.25 1.2v1.55"/>
            <path d="M6.75 6.75 7.6 19a1.5 1.5 0 0 0 1.5 1.4h5.8a1.5 1.5 0 0 0 1.5-1.4l.85-12.25"/>
            <path d="M10.5 10.5v6M13.5 10.5v6"/>
        </symbol>
        <symbol id="i-prev" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round">
            <path d="M17.5 6.2 8.8 12l8.7 5.8Z"/>
            <path d="M7 6.2v11.6" fill="none" stroke-linecap="round"/>
        </symbol>
        <symbol id="i-next" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round">
            <path d="M6.5 6.2 15.2 12 6.5 17.8Z"/>
            <path d="M17 6.2v11.6" fill="none" stroke-linecap="round"/>
        </symbol>
        <symbol id="i-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14.5 5.5 8 12l6.5 6.5"/>
        </symbol>
        <symbol id="i-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9.5 5.5 16 12l-6.5 6.5"/>
        </symbol>
        <!-- ── The calculator's own keys ───────────────────────── -->
        <symbol id="i-power" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
            <path d="M12 5v9"/>
        </symbol>
        <symbol id="i-home" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3.5 11.2 12 4.2l8.5 7"/>
            <path d="M6.2 10.3V19.5h11.6v-9.2"/>
        </symbol>
        <symbol id="i-sliders" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
            <path d="M3.5 7.5h17M3.5 12h17M3.5 16.5h17"/>
            <circle cx="15.5" cy="7.5" r="2.1" fill="currentColor" stroke="none"/>
            <circle cx="8.5" cy="12" r="2.1" fill="currentColor" stroke="none"/>
            <circle cx="16.5" cy="16.5" r="2.1" fill="currentColor" stroke="none"/>
        </symbol>
        <symbol id="i-back" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 5.5 4.5 10l4.5 4.5"/>
            <path d="M4.5 10h9a5.5 5.5 0 0 1 0 11H8.5"/>
        </symbol>
        <symbol id="i-shift" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 4.2 5 11.4h3.6v8.4h6.8v-8.4H19Z"/>
        </symbol>
        <symbol id="i-variable" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <rect x="10" y="6.5" width="10.5" height="11" rx="1.6"/>
            <path d="M13.1 9.7 17.4 14.3M17.4 9.7 13.1 14.3"/>
            <path d="M3 9.4h5.4M6.6 7.5 8.4 9.4 6.6 11.3M8.4 14.6H3M4.8 12.7 3 14.6l1.8 1.9"/>
        </symbol>
        <symbol id="i-function" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6.5 19.5V9a3 3 0 0 1 3-3h1"/>
            <path d="M4.3 11.6h5"/>
            <path d="M13.4 7.8c-1.6 2.4-1.6 6 0 8.4M20 7.8c1.6 2.4 1.6 6 0 8.4"/>
            <path d="M15.6 10.3 18 13.7M18 10.3l-2.4 3.4"/>
        </symbol>
        <symbol id="i-catalog" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 7.4C10.4 6.1 8.2 5.5 4.5 5.5v12c3.7 0 5.9.6 7.5 1.9 1.6-1.3 3.8-1.9 7.5-1.9v-12c-3.7 0-5.9.6-7.5 1.9Z"/>
            <path d="M12 7.4v12"/>
        </symbol>
        <symbol id="i-del" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 5.5h9.5a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H9L2.8 12Z"/>
            <path d="M11.9 9.7 16.5 14.3M16.5 9.7 11.9 14.3"/>
        </symbol>
        <symbol id="i-format" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4.8 10A7.8 7.8 0 0 1 19 7.8"/>
            <path d="M19.4 3.6 19.2 8l-4.4-.3"/>
            <path d="M19.2 14A7.8 7.8 0 0 1 5 16.2"/>
            <path d="M4.6 20.4 4.8 16l4.4.3"/>
        </symbol>
        <symbol id="i-chevrons" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 11.5 12 5.5l6 6M6 18.5 12 12.5l6 6"/>
        </symbol>
    </svg>

    <!-- ── Home ─────────────────────────────────────────────── -->
    <main class="home" id="home">
        <div class="modes glass" id="modes" role="tablist" aria-label="Timer mode">
            <span class="modes__thumb" aria-hidden="true"></span>
            <button class="mode" data-mode="stopwatch" role="tab" aria-selected="false">Stopwatch</button>
            <button class="mode" data-mode="pomodoro"  role="tab" aria-selected="false">Pomodoro</button>
            <button class="mode" data-mode="countdown" role="tab" aria-selected="false">Countdown</button>
        </div>

        <p class="hint" id="mode-hint">Pick how you want to track this session.</p>

        <div class="home__actions" id="home-actions">
            <button class="btn" id="adjust" hidden>Adjust</button>
            <button class="btn btn--primary" id="start">Start</button>
        </div>
    </main>

    <!-- ── Running session ──────────────────────────────────────
         One box, dragged anywhere on screen; the groove says so. The last
         two columns slide open and shut inside it. -->
    <section class="hud" id="hud" hidden>
        <div class="hud__box glass">
            <span class="grip" aria-hidden="true"></span>

            <div class="hud__row">
                <div class="hud__card">
                    <span class="hud__phase" id="phase">Stopwatch</span>
                    <span class="hud__time" id="time">0:00</span>
                    <span class="hud__progress" id="progress" aria-hidden="true"></span>
                </div>

                <div class="hud__controls">
                    <button class="iconbtn" id="toggle" aria-label="Pause">
                        <svg class="icon"><use id="toggle-icon" href="#i-pause"></use></svg>
                    </button>
                    <button class="iconbtn" id="focus" aria-label="Focus mode">
                        <svg class="icon"><use href="#i-expand"></use></svg>
                    </button>
                    <button class="iconbtn" id="tools" aria-label="Study tools" aria-expanded="false">
                        <svg class="icon"><use href="#i-toolbox"></use></svg>
                    </button>
                </div>

                <!-- Only while paused -->
                <div class="hud__controls hud__drawer" id="more" hidden>
                    <button class="iconbtn" id="restart" aria-label="Restart">
                        <svg class="icon"><use id="restart-icon" href="#i-restart"></use></svg>
                    </button>
                    <button class="iconbtn" id="audio" aria-label="Music" title="Music">
                        <svg class="icon"><use id="audio-icon" href="#i-mute"></use></svg>
                    </button>
                    <button class="iconbtn" id="open-settings" aria-label="Settings">
                        <svg class="icon"><use href="#i-gear"></use></svg>
                    </button>
                </div>

                <!-- Only while the toolbox is on -->
                <div class="hud__controls hud__drawer" id="toolpanel" hidden>
                    <button class="iconbtn" id="tool-math" aria-label="Math" title="Math">
                        <svg class="icon"><use href="#i-math"></use></svg>
                    </button>
                    <button class="iconbtn" id="tool-graph" aria-label="Graph" title="Graph">
                        <svg class="icon"><use href="#i-axes"></use></svg>
                    </button>
                    <button class="iconbtn" id="tool-notes" aria-label="Notes" title="Notes">
                        <svg class="icon"><use href="#i-notes"></use></svg>
                    </button>
                </div>
            </div>
        </div>
    </section>

    <!-- ── Calculator (the Math tool) ────────────────────────────
         An fx-82CW in glass, key for key: the control block with its
         cursor cross and page rocker, six columns of functions, then
         five of numbers. Each key's alternate function is printed above
         it on the left, with the same little elbow pointing back down at
         the key it belongs to. -->
    <section class="card calc glass" id="calc" hidden aria-label="Calculator">
        <header class="card__head">
            <span class="grip" aria-hidden="true"></span>
            <button class="card__close" id="calc-close" aria-label="Close calculator">
                <svg class="icon"><use href="#i-close"></use></svg>
            </button>
        </header>

        <div class="calc__screen">
            <div class="calc__flags">
                <span id="calc-armed">⇧</span>
                <span id="calc-app"></span>
                <span id="calc-unit">DEG</span>
                <span id="calc-fmt"></span>
                <span id="calc-wrap"></span>
            </div>

            <!-- What you are typing, and what it came to. The label
                 above only shows while a screen is asking for a value. -->
            <div class="calc__work" id="calc-work">
                <p class="calc__ask" id="calc-ask" hidden></p>
                <p class="calc__entry" id="calc-entry"></p>
                <p class="calc__out" id="calc-out">0</p>
            </div>

            <!-- The table the other three apps put up: the Statistics
                 editor and its results, the number table, and the rolls
                 and tosses of Math Box. -->
            <div class="calc__grid" id="calc-grid" hidden>
                <div class="calc__scroll">
                    <table class="calc__table">
                        <thead><tr id="calc-head"></tr></thead>
                        <tbody id="calc-body"></tbody>
                    </table>
                </div>
                <p class="calc__cell" id="calc-cell"></p>
            </div>

            <!-- A menu takes the screen over while it is up, walked with
                 the cursor cross and entered with OK. -->
            <div class="calc__menu" id="calc-menu" hidden>
                <p class="calc__title" id="calc-title"></p>
                <ul class="calc__list" id="calc-list"></ul>
            </div>
        </div>

        <div class="calc__pad" id="calc-pad">
            <!-- The control block. -->
            <div class="pad pad--top">
                <button class="key key--dim at-on" data-cmd="on" aria-label="On"><b>ON</b><svg class="icon"><use href="#i-power"></use></svg></button>
                <button class="key key--dim at-home" data-cmd="home" aria-label="Home"><b>HOME</b><svg class="icon"><use href="#i-home"></use></svg></button>
                <button class="key key--dim at-set" data-cmd="settings" aria-label="Settings"><b>SETTINGS</b><svg class="icon"><use href="#i-sliders"></use></svg></button>
                <button class="key key--dim at-back" data-cmd="back" aria-label="Back"><svg class="icon"><use href="#i-back"></use></svg></button>
                <button class="key key--lit at-shift" data-cmd="shift" aria-label="Shift"><b>SHIFT</b><svg class="icon"><use href="#i-shift"></use></svg></button>
                <button class="key at-var" data-cmd="variable" aria-label="Variable"><b>VARIABLE</b><svg class="icon"><use href="#i-variable"></use></svg></button>
                <button class="key at-fun" data-cmd="funcs" aria-label="Function"><b>FUNCTION</b><svg class="icon"><use href="#i-function"></use></svg></button>
                <button class="key at-cat" data-cmd="catalog" aria-label="Catalog"><b>CATALOG</b><svg class="icon"><use href="#i-catalog"></use></svg></button>
                <button class="key at-tool" data-cmd="tools" aria-label="Tools"><b>TOOLS</b><svg class="icon"><use href="#i-other"></use></svg></button>

                <button class="key key--dim at-up" data-cmd="up" aria-label="Up">▲</button>
                <button class="key key--dim at-left" data-cmd="left" aria-label="Left">◀</button>
                <button class="key key--dim at-ok" data-cmd="ok">OK</button>
                <button class="key key--dim at-right" data-cmd="right" aria-label="Right">▶</button>
                <button class="key key--dim at-down" data-cmd="down" aria-label="Down">▼</button>

                <div class="pad__rocker at-page">
                    <button class="key key--dim" data-cmd="pgup" aria-label="Page up"><svg class="icon"><use href="#i-chevrons"></use></svg></button>
                    <button class="key key--dim" data-cmd="pgdn" aria-label="Page down"><svg class="icon icon--flip"><use href="#i-chevrons"></use></svg></button>
                </div>
            </div>

            <!-- Six columns of functions. -->
            <div class="pad pad--fn">
                <button class="key" data-ins="x" data-altcmd="qr"><i>QR</i><em>x</em></button>
                <button class="key" data-ins="/" data-shift="¦"><i>▪ ▪⁄▫</i><span class="frac"><span>▪</span><span>▫</span></span></button>
                <button class="key" data-ins="√(" data-shift="∛("><i>³√▫</i>√▪</button>
                <button class="key" data-ins="^" data-shift="⁻¹"><i>▪⁻¹</i>▪<sup>▫</sup></button>
                <button class="key" data-ins="²" data-shift="log("><i>log</i>▪<sup>2</sup></button>
                <button class="key" data-ins="log(▯,)" data-shift="ln("><i>ln</i>log<sub>▪</sub>▫</button>

                <button class="key" data-ins="Ans">Ans</button>
                <button class="key" data-ins="sin(" data-shift="sin⁻¹("><i>sin⁻¹</i>sin</button>
                <button class="key" data-ins="cos(" data-shift="cos⁻¹("><i>cos⁻¹</i>cos</button>
                <button class="key" data-ins="tan(" data-shift="tan⁻¹("><i>tan⁻¹</i>tan</button>
                <button class="key" data-ins="(">(</button>
                <button class="key" data-ins=")" data-shift=","><i>,</i>)</button>
            </div>

            <!-- Five of numbers. -->
            <div class="pad pad--num">
                <button class="key" data-ins="7" data-shift="π"><i>π</i>7</button>
                <button class="key" data-ins="8" data-shift="e"><i>e</i>8</button>
                <button class="key" data-ins="9">9</button>
                <button class="key" data-cmd="del" data-altcmd="wrap" aria-label="Delete"><i>INS</i><svg class="icon"><use href="#i-del"></use></svg></button>
                <button class="key" data-cmd="ac" data-altcmd="off"><i>OFF</i>AC</button>

                <button class="key" data-ins="4" data-shift="A"><i>A</i>4</button>
                <button class="key" data-ins="5" data-shift="B"><i>B</i>5</button>
                <button class="key" data-ins="6" data-shift="C"><i>C</i>6</button>
                <button class="key" data-ins="×">×</button>
                <button class="key" data-ins="÷">÷</button>

                <button class="key" data-ins="1" data-shift="D"><i>D</i>1</button>
                <button class="key" data-ins="2" data-shift="E"><i>E</i>2</button>
                <button class="key" data-ins="3" data-shift="F"><i>F</i>3</button>
                <button class="key" data-ins="+" data-shift="°"><i>°′″</i>+</button>
                <button class="key" data-ins="−" data-shift="−"><i>(−)</i>−</button>

                <button class="key" data-ins="0" data-shift="x"><i>x</i>0</button>
                <button class="key" data-ins="." data-shift="y"><i>y</i>.</button>
                <button class="key" data-ins="×10^" data-shift="z"><i>z</i>×10<sup>▪</sup></button>
                <button class="key" data-cmd="format" aria-label="Format"><svg class="icon"><use href="#i-format"></use></svg></button>
                <button class="key key--go" data-cmd="exe" data-altcmd="approx"><i>≈</i>EXE</button>
            </div>
        </div>
        <span class="card__grab" id="calc-grab" aria-hidden="true"></span>
    </section>

    <!-- ── Graph (the Graph tool) ───────────────────────────────
         A plane and the lines drawn on it: the expressions down one side,
         the plot on the other. Each row carries its own ink, and the dot
         beside it takes the line off the plane without giving up the
         typing. A row that reads `a = 3` grows a slider. -->
    <section class="card graph glass" id="graph" hidden aria-label="Graph">
        <header class="card__head">
            <span class="grip" aria-hidden="true"></span>
            <button class="card__close" id="graph-close" aria-label="Close graph">
                <svg class="icon"><use href="#i-close"></use></svg>
            </button>
        </header>

        <div class="graph__body">
            <div class="graph__side">
                <ul class="graph__list" id="graph-list"></ul>
                <button class="graph__add" id="graph-add">
                    <svg class="icon"><use href="#i-plus"></use></svg>Expression
                </button>
            </div>

            <div class="graph__plot" id="graph-plot">
                <canvas class="graph__plane" id="graph-plane"></canvas>
                <p class="graph__at" id="graph-at" aria-live="off"></p>
                <div class="graph__view">
                    <button class="iconbtn" id="graph-in" aria-label="Zoom in">
                        <svg class="icon"><use href="#i-plus"></use></svg>
                    </button>
                    <button class="iconbtn" id="graph-out" aria-label="Zoom out">
                        <svg class="icon"><use href="#i-minus"></use></svg>
                    </button>
                    <button class="iconbtn" id="graph-home" aria-label="Reset the view">
                        <svg class="icon"><use href="#i-home"></use></svg>
                    </button>
                </div>
            </div>
        </div>
        <span class="card__grab" id="graph-grab" aria-hidden="true"></span>
    </section>

    <!-- ── Notes (the Notes tool) ────────────────────────────────
         A pad of sheets rather than one, kept between sessions. The strip
         under the head turns the pages: a sheet is named by its own first
         line, so there is nothing extra to fill in. -->
    <section class="card notes glass" id="notes" hidden aria-label="Notes">
        <header class="card__head">
            <span class="grip" aria-hidden="true"></span>
            <button class="card__close" id="notes-close" aria-label="Close notes">
                <svg class="icon"><use href="#i-close"></use></svg>
            </button>
        </header>

        <div class="notes__pages">
            <button class="notes__step" id="page-prev" aria-label="Previous page">
                <svg class="icon"><use href="#i-left"></use></svg>
            </button>
            <p class="notes__title" id="page-title" aria-live="polite">Untitled</p>
            <span class="notes__count" id="page-count">1/1</span>
            <button class="notes__step" id="page-next" aria-label="Next page">
                <svg class="icon"><use href="#i-right"></use></svg>
            </button>
            <button class="notes__step notes__step--edge" id="page-new" aria-label="New page" title="New page">
                <svg class="icon"><use href="#i-plus"></use></svg>
            </button>
            <button class="notes__step" id="page-drop" aria-label="Delete this page" title="Delete this page">
                <svg class="icon"><use href="#i-bin"></use></svg>
            </button>
        </div>

        <textarea class="notes__sheet" id="notes-sheet" spellcheck="false"
                  placeholder="Anything worth keeping."></textarea>
        <span class="card__grab" id="notes-grab" aria-hidden="true"></span>
    </section>

    <!-- ── Music (the speaker) ──────────────────────────────────
         A thin tube rather than a card: the playlist between its arrows,
         the three keys, what is playing, and how far in. It fills along
         its lower edge as the track runs, the way the island does. -->
    <section class="card music glass" id="music" hidden aria-label="Music">
        <button class="music__step" id="list-prev" aria-label="Previous playlist">
            <svg class="icon"><use href="#i-left"></use></svg>
        </button>
        <p class="music__name" id="list-name" aria-live="polite">Cozy</p>
        <button class="music__step" id="list-next" aria-label="Next playlist">
            <svg class="icon"><use href="#i-right"></use></svg>
        </button>

        <button class="music__key" id="track-prev" aria-label="Previous track">
            <svg class="icon"><use href="#i-prev"></use></svg>
        </button>
        <button class="music__key music__key--go" id="track-play" aria-label="Play">
            <svg class="icon"><use id="play-icon" href="#i-play"></use></svg>
        </button>
        <button class="music__key" id="track-next" aria-label="Next track">
            <svg class="icon"><use href="#i-next"></use></svg>
        </button>

        <p class="music__now">
            <span class="music__title" id="track-title">—</span>
            <span class="music__by" id="track-by"></span>
        </p>

        <p class="music__clock">
            <span class="music__at" id="track-at">0:00</span><span id="track-len">0:00</span>
        </p>

        <button class="music__shut" id="music-close" aria-label="Stop the music">
            <svg class="icon"><use href="#i-close"></use></svg>
        </button>

        <!-- The strip that scrubs, and the line it moves: the strip comes
             first so reaching for it can thicken the line. -->
        <input type="range" class="music__seek" id="seek" min="0" max="1000" step="1" value="0"
               aria-label="Seek">
        <span class="music__line" id="music-line" aria-hidden="true"></span>
    </section>

    <!-- ── Focus mode ───────────────────────────────────────── -->
    <div class="zen" id="zen" hidden>
        <span class="zen__phase" id="zen-phase"></span>
        <span class="zen__time" id="zen-time">0:00</span>
        <span class="zen__hint">Tap anywhere or press Esc to come back</span>
    </div>

    <!-- ── Setup (pomodoro / countdown) ─────────────────────── -->
    <div class="modal" id="setup" hidden>
        <div class="modal__scrim" data-close></div>
        <div class="modal__card glass" role="dialog" aria-modal="true" aria-labelledby="setup-title">
            <header class="modal__head">
                <h2 id="setup-title">Pomodoro</h2>
                <button class="iconbtn" data-close aria-label="Close">
                    <svg class="icon"><use href="#i-close"></use></svg>
                </button>
            </header>

            <div class="modal__body">
                <div class="fields" id="setup-pomodoro">
                    <label class="field">
                        <span class="field__label">Focus block <output id="focus-out">25</output> min</span>
                        <input type="range" class="slider" id="focus-minutes" min="5" max="90" step="5" value="25">
                    </label>
                    <label class="field">
                        <span class="field__label">Break <output id="break-out">5</output> min</span>
                        <input type="range" class="slider" id="break-minutes" min="3" max="30" step="1" value="5">
                    </label>
                </div>

                <div class="fields" id="setup-countdown" hidden>
                    <div class="field">
                        <span class="field__label">Count down from</span>
                        <div class="duration">
                            <label><input type="number" class="number" id="target-h" min="0" max="23" value="0" inputmode="numeric"><span>hrs</span></label>
                            <label><input type="number" class="number" id="target-m" min="0" max="59" value="45" inputmode="numeric"><span>min</span></label>
                            <label><input type="number" class="number" id="target-s" min="0" max="59" value="0" inputmode="numeric"><span>sec</span></label>
                        </div>
                    </div>
                </div>
            </div>

            <footer class="modal__foot">
                <button class="btn btn--primary" id="setup-save">Save</button>
            </footer>
        </div>
    </div>

    <!-- ── Settings ─────────────────────────────────────────── -->
    <div class="modal" id="settings" hidden>
        <div class="modal__scrim" data-close></div>
        <div class="modal__card glass" role="dialog" aria-modal="true" aria-labelledby="settings-title">
            <header class="modal__head">
                <h2 id="settings-title">Settings</h2>
                <button class="iconbtn" data-close aria-label="Close">
                    <svg class="icon"><use href="#i-close"></use></svg>
                </button>
            </header>

            <div class="modal__body">
                <div class="fields">
                    <label class="field">
                        <span class="field__label">Background dim <output id="dim-out">30</output>%</span>
                        <input type="range" class="slider" id="dim" min="0" max="80" step="5" value="30">
                    </label>

                    <label class="switch">
                        <input type="checkbox" id="opt-still">
                        <span class="switch__track"><span class="switch__knob"></span></span>
                        <span class="switch__text">Low detail background</span>
                    </label>

                    <label class="switch">
                        <input type="checkbox" id="opt-sound" checked>
                        <span class="switch__track"><span class="switch__knob"></span></span>
                        <span class="switch__text">Chime when a block ends</span>
                    </label>

                    <label class="switch">
                        <input type="checkbox" id="opt-trail" checked>
                        <span class="switch__track"><span class="switch__knob"></span></span>
                        <span class="switch__text">Cursor trail</span>
                    </label>

                    <div class="field">
                        <span class="field__label">Today's total</span>
                        <p class="field__note" id="today-total">0:00</p>
                    </div>
                </div>
            </div>

            <footer class="modal__foot">
                <button class="btn" id="end-session">End session</button>
            </footer>
        </div>
    </div>

    <canvas id="cursor-trail" aria-hidden="true"></canvas>

    <script src="static/timer.js" defer></script>
    <script src="static/graph.js" defer></script>
    <script src="static/music.js" defer></script>
    <script src="static/cursor.js" defer></script>
</body>
</html>
